# 매일 아침 블로그 새 글을 반영해 홈페이지를 다시 만들고 GitHub Pages에 배포한다.
name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 네이버가 응답하지 않으면 마지막으로 저장된 blog.json으로 만든다
      - name: Fetch blog
        run: python fetch.py
        continue-on-error: true
      - name: Build page
        run: python build.py
      # 예약일(한국 시간)이 된 글만 공개
      - name: Publish scheduled writings
        run: python writings.py
      # 행복나눔축제 안내 페이지 + 첫 화면 배너(행사일까지)
      - name: Event page
        run: python event.py
      # 저장소에 최신 글 목록을 남긴다(실패해도 배포는 계속한다)
      - name: Save updated blog data
        continue-on-error: true
        run: |
          git config user.name "homepage-bot"
          git config user.email "homepage-bot@users.noreply.github.com"
          git add blog.json index.html
          if ! git diff --cached --quiet; then
            git commit -m "블로그 새 글 반영"
            git pull --rebase -X ours origin main && git push
          fi
      - name: Prepare site
        run: mkdir -p _site && cp -r index.html event.html privacy.html assets writings _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
