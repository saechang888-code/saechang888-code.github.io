# 매일 아침 블로그 새 글을 반영해 홈페이지를 다시 만들고 GitHub Pages에 배포한다.
name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 네이버가 응답하지 않으면 마지막으로 저장된 blog.json으로 만든다
      - name: Fetch blog
        run: python fetch.py
        continue-on-error: true
      - name: Build page
        run: python build.py
      - name: Save updated blog data
        run: |
          git config user.name "homepage-bot"
          git config user.email "homepage-bot@users.noreply.github.com"
          git add blog.json index.html
          git diff --cached --quiet || git commit -m "블로그 새 글 반영" && git push
      - name: Prepare site
        run: mkdir -p _site && cp -r index.html assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
