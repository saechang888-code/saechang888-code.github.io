<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뜻으로 찾기 · 독서주특기</title>
<meta name="description" content="찾고 싶은 내용을 문장으로 적으면, 낱말이 달라도 뜻이 비슷한 예화·설교·독후감·시를 찾아 드립니다.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--paper:#f7f4ec;--sheet:#fffdf8;--ink:#1f2a2e;--muted:#62706f;--rule:#e2dccd;--green:#23443a;--gold:#b08a3e;
--display:"Noto Serif KR","Batang",serif;--body:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#141819;--sheet:#1b2122;--ink:#e8e6df;--muted:#9eaaa7;--rule:#2f3738;--green:#8cc4ad;--gold:#d6b46c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.8;padding-inline:16px;word-break:keep-all}
a{color:var(--green)}
.wrap{max-width:820px;margin:0 auto;padding-block:32px 64px;display:grid;gap:20px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.92rem}
.top a{text-decoration:none} .brand{font-family:var(--display);font-weight:900;color:var(--ink)}
h1{font-family:var(--display);font-weight:900;font-size:clamp(1.7rem,4.5vw,2.4rem);margin:0;line-height:1.3}
.lede{color:var(--muted);margin:0}
form{display:flex;gap:8px;flex-wrap:wrap}
textarea{flex:1 1 100%;font:inherit;min-height:4.6em;padding:12px 14px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);border-radius:10px;resize:vertical}
textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:700;padding:10px 22px;border:0;border-radius:10px;background:var(--green);color:var(--paper);cursor:pointer}
.kinds{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.kinds label{border:1px solid var(--rule);background:var(--sheet);border-radius:99px;padding:3px 12px;font-size:.9rem;cursor:pointer}
.kinds input{position:absolute;opacity:0;pointer-events:none}
.kinds label:has(input:checked){border-color:var(--green);color:var(--green);font-weight:700}
.kinds label:has(input:focus-visible){outline:2px solid var(--gold)}
.ex{font-size:.9rem;color:var(--muted)} .ex a{cursor:pointer;margin-right:10px}
#st{color:var(--muted);font-size:.92rem;margin:0;min-height:1.6em}
ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
li{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:14px 18px}
li a.t{font-family:var(--display);font-weight:700;font-size:1.08rem;text-decoration:none}
li a.t:hover{text-decoration:underline}
.meta{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}
.badge{border:1px solid var(--gold);color:var(--gold);border-radius:6px;padding:0 7px;font-weight:700}
li p{margin:.3em 0 0;color:var(--muted);font-size:.93rem}
.more{justify-self:center}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="brand" href="../index.html">독서주특기</a><span><a href="../index.html">홈</a> · <a href="../yehwa/index.html">주제별 예화</a> · <a href="../writings/index.html">글 보관함</a></span></div>
<h1>뜻으로 찾기</h1>
<p class="lede">찾고 싶은 내용을 문장으로 적어 보세요. 낱말이 똑같지 않아도 뜻이 비슷한 예화·설교·독후감·시를 가까운 순서대로 찾아 드립니다.</p>
<form id="f">
<label for="q" class="lede" style="flex-basis:100%">찾을 내용</label>
<textarea id="q" name="q" placeholder="예: 아버지가 자식 대신 목숨을 내어 준 이야기"></textarea>
<div class="kinds" role="group" aria-label="찾을 글 종류">
<label><input type="radio" name="k" value="" checked>전체</label>
<label><input type="radio" name="k" value="예화">예화</label>
<label><input type="radio" name="k" value="설교">설교</label>
<label><input type="radio" name="k" value="독후감">독후감</label>
<label><input type="radio" name="k" value="시">시</label>
</div>
<button type="submit">찾기</button>
</form>
<div class="ex">이렇게도 찾아보세요: <a data-q="풍랑 속에서도 두려워하지 않는 믿음">풍랑 속의 믿음</a><a data-q="원수를 용서하고 사랑으로 갚은 사람">원수를 용서함</a><a data-q="어머니의 눈물의 기도로 돌아온 아들">어머니의 기도</a><a data-q="작은 친절이 한 사람의 인생을 바꾼 이야기">작은 친절</a></div>
<p id="st" role="status" aria-live="polite"></p>
<ol id="r"></ol>
<button id="more" class="more" hidden>더 보기</button>
</div>
<script>
// 글자 나누기·평균 내기는 search_site.py 와 똑같다 (한쪽을 고치면 다른 쪽도 고친다)
const PUNCT = '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~';
let V, PIECE, MAXLEN, VEC, SC, IDF, DIM, DOCS, DV, ready;
function norm(t) {
  t = t.normalize('NFKC');
  let o = '';
  for (const c of t) o += PUNCT.includes(c) ? ' ' + c + ' ' : c;
  return o.replace(/\s+/g, ' ').trim();
}
function tokenize(t) {
  const out = [];
  for (const w of norm(t).split(' ')) {
    if (!w) continue;
    const s = Array.from('▁' + w), n = s.length;
    const bs = new Float64Array(n + 1).fill(-1e18), bp = new Int32Array(n + 1).fill(-1); bs[0] = 0;
    for (let i = 0; i < n; i++) {
      if (bs[i] <= -1e18) continue;
      let sub = '';
      for (let j = i + 1; j <= Math.min(n, i + MAXLEN); j++) {
        sub += s[j - 1];
        const k = PIECE.get(sub);
        if (k !== undefined) { const sc = bs[i] + V.s[k]; if (sc > bs[j]) { bs[j] = sc; bp[j] = i; } }
      }
      if (bs[i + 1] <= -1e18) { bs[i + 1] = bs[i] - 100; bp[i + 1] = i; }
    }
    const ids = [];
    for (let j = n; j > 0;) { const i = bp[j]; const k = PIECE.get(s.slice(i, j).join('')); if (k !== undefined) ids.push(k); j = i; }
    out.push(...ids.reverse());
    if (out.length >= 512) break;
  }
  return out.slice(0, 512);
}
function embed(t) {
  const ids = tokenize(t), v = new Float32Array(DIM);
  for (const k of ids) { const o = k * DIM, s = SC[k] * IDF[k]; for (let d = 0; d < DIM; d++) v[d] += VEC[o + d] * s; }
  let n = 0; for (let d = 0; d < DIM; d++) n += v[d] * v[d]; n = Math.sqrt(n) || 1;
  for (let d = 0; d < DIM; d++) v[d] /= n;
  return v;
}
async function load() {
  const st = document.getElementById('st');
  st.textContent = '찾기 자료를 불러오는 중입니다… (처음 한 번만 조금 걸립니다)';
  const [v, vb, sb, ib, dj, db] = await Promise.all([
    fetch('vocab.json').then(r => r.json()), fetch('vecs.bin').then(r => r.arrayBuffer()),
    fetch('idf.bin').then(r => r.arrayBuffer()),
    fetch('scale.bin').then(r => r.arrayBuffer()), fetch('docs.json').then(r => r.json()), fetch('docs.bin').then(r => r.arrayBuffer())]);
  V = v; DIM = v.dim; PIECE = new Map(v.p.map((p, i) => [p, i])); MAXLEN = Math.max(...v.p.map(p => Array.from(p).length));
  VEC = new Int8Array(vb); SC = new Float32Array(sb); IDF = new Float32Array(ib); DOCS = dj.d; DV = new Int8Array(db);
  st.textContent = '';
}
ready = load();
let hits = [], shown = 0;
// 낱말 맞추기: 검색어의 두 글자 조각이 글 첫머리에 얼마나 들어 있는지 (드문 조각일수록 무겁게)
function bigrams(q) {
  const s = new Set();
  for (const w of q.match(/[가-힣A-Za-z0-9]+/g) || []) for (let i = 0; i + 1 < w.length; i++) s.add(w.slice(i, i + 2));
  return [...s];
}
async function run(q, kind) {
  const st = document.getElementById('st'), r = document.getElementById('r');
  if (!q.trim()) return;
  try { await ready; } catch (e) { st.textContent = '찾기 자료를 불러오지 못했습니다. 잠시 뒤 다시 해 보세요.'; return; }
  const qv = embed(q), bg = bigrams(q), N = DOCS.length;
  const has = bg.map(() => []);
  for (let i = 0; i < N; i++) {
    const t = DOCS[i][1] + ' ' + DOCS[i][4];
    bg.forEach((b, j) => { if (t.includes(b)) has[j].push(i); });
  }
  const lex = new Float32Array(N); let tot = 0;
  bg.forEach((b, j) => { const w = Math.log(N / (has[j].length + 1) + 1); tot += w; for (const i of has[j]) lex[i] += w; });
  const sc = [];
  for (let i = 0; i < N; i++) {
    const d = DOCS[i];
    if (kind && d[0] !== kind) continue;
    let s = 0; const o = i * DIM;
    for (let k = 0; k < DIM; k++) s += qv[k] * DV[o + k];
    s = s / 127 + (tot ? 0.5 * lex[i] / tot : 0);     // 뜻 + 낱말 (search_site.py 시험에서 고른 비율)
    sc.push([s, i]);
  }
  sc.sort((a, b) => b[0] - a[0]);
  hits = sc.slice(0, 200); shown = 0; r.innerHTML = '';
  st.textContent = hits.length ? `뜻이 가까운 순서로 보여 드립니다.` : '찾은 글이 없습니다.';
  more();
  const u = new URL(location); u.searchParams.set('q', q); kind ? u.searchParams.set('k', kind) : u.searchParams.delete('k'); history.replaceState(null, '', u);
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function more() {
  const r = document.getElementById('r'), b = document.getElementById('more');
  const part = hits.slice(shown, shown + 20);
  r.insertAdjacentHTML('beforeend', part.map(([s, i]) => {
    const [k, t, kw, u, tx] = DOCS[i], sn = tx.length > 110 ? tx.slice(0, 110) + '…' : tx;
    return `<li><div class="meta"><span class="badge">${esc(k)}</span>${kw ? `<span>【${esc(kw)}】</span>` : ''}</div>`
      + `<a class="t" href="../${u}">${esc(t)}</a><p>${esc(sn)}</p></li>`;
  }).join(''));
  shown += part.length; b.hidden = shown >= hits.length;
}
document.getElementById('more').onclick = more;
const f = document.getElementById('f');
f.onsubmit = e => { e.preventDefault(); run(f.q.value, f.k.value); };
f.q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.requestSubmit(); } });
for (const a of document.querySelectorAll('.ex a')) a.onclick = () => { f.q.value = a.dataset.q; f.requestSubmit(); };
for (const x of f.k) x.onchange = () => { if (f.q.value.trim()) f.requestSubmit(); };
const p = new URLSearchParams(location.search);
if (p.get('k')) for (const x of f.k) x.checked = x.value === p.get('k');
if (p.get('q')) { f.q.value = p.get('q'); run(p.get('q'), f.k.value); }
</script>
</body>
</html>
